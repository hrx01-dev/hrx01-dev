<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Animated hrx01-dev banner</title>
  <desc id="desc">Animated banner with username and social links for GitHub, LinkedIn, and email.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#111827;#020617" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#0b1124;#0f172a" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .sweep { animation: sweep 8s linear infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .sub { fill: #cbd5e1; font: 500 30px/1.2 Inter,Segoe UI,Arial,sans-serif; letter-spacing: 0.5px; }
      .title { fill: #e2e8f0; font: 700 64px/1.1 Inter,Segoe UI,Arial,sans-serif; letter-spacing: 2px; }
      @keyframes sweep { to { transform: translateX(1200px); } }
      @keyframes float { 0%,100%{ transform: translateY(0);}50%{ transform: translateY(-4px);} }
      @media (prefers-reduced-motion: reduce) { .sweep,.float { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="280" rx="26" fill="url(#bg)"/>
  <circle cx="1060" cy="70" r="64" fill="#38bdf8" opacity=".14" filter="url(#glow)"/>
  <circle cx="170" cy="220" r="70" fill="#a78bfa" opacity=".16" filter="url(#glow)"/>

  <g class="float">
    <text x="72" y="120" class="title">hrx01-dev</text>
    <text x="72" y="178" class="sub">GitHub · @hrx01-dev</text>
    <text x="470" y="178" class="sub">LinkedIn · /in/jayam-srivastava-519aa8377</text>
    <text x="72" y="222" class="sub">Email · jayamsrivastava99@gmail.com</text>
  </g>

  <rect x="-280" y="0" width="180" height="280" fill="url(#line)" opacity=".22" class="sweep"/>
</svg>

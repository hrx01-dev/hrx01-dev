<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Animated Jayam Srivastava banner</title>
  <desc id="desc">Animated banner with username and social links for GitHub, LinkedIn, and email.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#111827;#020617" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#0b1124;#0f172a" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .sweep { animation: sweep 8s linear infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .sub { fill: #cbd5e1; font: 500 18px/1.25 Inter,Segoe UI,Arial,sans-serif; letter-spacing: 0.2px; }
      .title { fill: #e2e8f0; font: 700 58px/1.1 Inter,Segoe UI,Arial,sans-serif; letter-spacing: 1.2px; }
      @keyframes sweep { to { transform: translateX(1200px); } }
      @keyframes float { 0%,100%{ transform: translateY(0);}50%{ transform: translateY(-4px);} }
      @media (prefers-reduced-motion: reduce) { .sweep,.float { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>
  <circle cx="1060" cy="70" r="64" fill="#38bdf8" opacity=".14" filter="url(#glow)"/>
  <circle cx="170" cy="250" r="70" fill="#a78bfa" opacity=".16" filter="url(#glow)"/>

  <g class="float">
    <text x="72" y="120" class="title">Jayam Srivastava</text>
    <g transform="translate(700 72)">
      <circle cx="24" cy="24" r="24" fill="#0b1220" stroke="#94a3b8" stroke-opacity=".45"/>
      <path d="M24 11c-7.2 0-13 5.8-13 13 0 5.7 3.7 10.6 8.8 12.3.7.1.9-.3.9-.7v-2.2c-3.6.8-4.3-1.5-4.3-1.5-.6-1.4-1.4-1.8-1.4-1.8-1.2-.8.1-.8.1-.8 1.3.1 2 1.4 2 1.4 1.2 2 3.1 1.4 3.8 1.1.1-.8.4-1.4.9-1.7-2.9-.3-5.8-1.4-5.8-6.1 0-1.3.5-2.4 1.3-3.3-.1-.3-.5-1.6.1-3.3 0 0 1.1-.3 3.6 1.3 1-.3 2.1-.4 3.2-.4 1.1 0 2.2.1 3.2.4 2.4-1.6 3.5-1.3 3.5-1.3.7 1.7.3 3 .2 3.3.8.9 1.3 2 1.3 3.3 0 4.8-3 5.8-5.9 6.1.5.4.9 1.2.9 2.3v3.3c0 .4.2.8.9.7 5.1-1.7 8.8-6.6 8.8-12.3 0-7.2-5.8-13-13-13z" fill="#f8fafc"/>
    </g>
    <circle cx="92" cy="178" r="17" fill="#111827" stroke="#94a3b8" stroke-opacity=".45"/>
    <text x="92" y="185" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">GH</text>
    <text x="122" y="188" class="sub">https://github.com/hrx01-dev</text>

    <rect x="75" y="203" width="34" height="34" rx="8" fill="#2563eb" />
    <text x="92" y="226" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">in</text>
    <text x="122" y="228" class="sub">https://www.linkedin.com/in/jayam-srivastava-519aa8377</text>

    <rect x="74" y="248" width="36" height="24" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-opacity=".5"/>
    <path d="M77 251l15 11 15-11" fill="none" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="268" class="sub">mailto:jayamsrivastava99@gmail.com</text>
  </g>

  <rect x="-280" y="0" width="180" height="320" fill="url(#line)" opacity=".22" class="sweep"/>
</svg>

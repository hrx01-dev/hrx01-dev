<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Featured project showcase</title>
  <desc id="desc">Animated product dashboard preview with gradient accents and data cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#121d38"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102445"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .float { animation: float 5s ease-in-out infinite; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .path { stroke-dasharray: 360; stroke-dashoffset: 360; animation: draw 2.4s ease-out forwards .35s; }
      .spark { animation: drift 7s linear infinite; }
      @keyframes float { 0%,100%{ transform: translateY(0);}50%{ transform: translateY(-6px);} }
      @keyframes pulse { 0%,100%{ opacity:.52;}50%{ opacity:.9;} }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes drift { from { transform: translateX(-70px);} to { transform: translateX(780px);} }
      @media (prefers-reduced-motion: reduce) {
        .float,.pulse,.path,.spark { animation: none !important; }
        .path { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="28" y="24" width="744" height="402" rx="20" fill="url(#panel)" stroke="rgba(148,163,184,.35)"/>

  <g class="pulse">
    <circle cx="690" cy="88" r="64" fill="url(#accent)" opacity=".18"/>
  </g>

  <rect x="58" y="62" width="218" height="24" rx="12" fill="rgba(148,163,184,.22)"/>
  <rect x="58" y="100" width="312" height="10" rx="5" fill="rgba(148,163,184,.2)"/>

  <g class="float">
    <rect x="58" y="134" width="238" height="140" rx="16" fill="rgba(15,23,42,.88)" stroke="rgba(34,211,238,.35)"/>
    <path d="M86 230l36-42 33 23 41-56 35 40 35-28" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" class="path"/>
  </g>

  <rect x="318" y="134" width="424" height="236" rx="16" fill="rgba(15,23,42,.88)" stroke="rgba(196,181,253,.34)"/>
  <rect x="344" y="164" width="174" height="14" rx="7" fill="rgba(148,163,184,.24)"/>
  <rect x="344" y="192" width="362" height="10" rx="5" fill="rgba(148,163,184,.18)"/>

  <g>
    <rect x="344" y="228" width="164" height="116" rx="14" fill="rgba(2,6,23,.5)" stroke="rgba(56,189,248,.36)"/>
    <rect x="528" y="228" width="178" height="52" rx="12" fill="rgba(2,6,23,.45)" stroke="rgba(167,139,250,.34)"/>
    <rect x="528" y="292" width="178" height="52" rx="12" fill="rgba(2,6,23,.45)" stroke="rgba(34,211,238,.34)"/>
  </g>

  <g class="spark" opacity=".7">
    <circle cx="0" cy="78" r="3" fill="#67e8f9"/>
    <circle cx="92" cy="78" r="2" fill="#c4b5fd"/>
    <circle cx="164" cy="78" r="2.8" fill="#67e8f9"/>
    <circle cx="236" cy="78" r="2" fill="#c4b5fd"/>
  </g>
</svg>

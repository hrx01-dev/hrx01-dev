<svg xmlns="http://www.w3.org/2000/svg" width="960" height="66" viewBox="0 0 960 66" role="img" aria-labelledby="title desc">
<title id="title">Imagine. Build. Refine. Repeat.</title><desc id="desc">A softly animated light travels between the four stages of my creative process.</desc>
<style>
.signal { animation: travel 8s ease-in-out infinite; }
.halo { animation: breathe 3s ease-in-out infinite; }
@keyframes travel { 0%,12% { transform:translateX(0); opacity:0; } 18% { opacity:1; } 82% { opacity:1; } 90%,100% { transform:translateX(872px); opacity:0; } }
@keyframes breathe { 0%,100% { opacity:.35; } 50% { opacity:.8; } }
@media (prefers-reduced-motion: reduce) { .signal,.halo { animation:none; } .signal { opacity:0; } }
</style>
<rect width="960" height="66" rx="6" fill="#0d141a"/>
<path d="M44 49H916" stroke="#29363c"/>
<g fill="#9ce8ce"><circle cx="44" cy="49" r="2.5"/><circle cx="335" cy="49" r="2.5"/><circle cx="625" cy="49" r="2.5"/><circle cx="916" cy="49" r="2.5"/></g>
<g font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2" fill="#c4d0d4"><text x="44" y="29">01 / IMAGINE</text><text x="296" y="29">02 / BUILD</text><text x="574" y="29">03 / REFINE</text><text x="811" y="29">04 / REPEAT</text></g>
<g class="signal" fill="#b6ffe3"><circle class="halo" cx="44" cy="49" r="7" opacity=".25"/><circle cx="44" cy="49" r="3"/></g>
</svg>
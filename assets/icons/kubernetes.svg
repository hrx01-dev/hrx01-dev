<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="K8 icon">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="h" cx="35%" cy="28%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ring { transform-origin: 32px 32px; animation: spin 8s linear infinite; }
      .core { animation: pulse 3.5s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { .ring,.core { animation: none !important; } }
    </style>
  </defs>
  <circle cx="32" cy="32" r="30" fill="rgba(15,23,42,.55)"/>
  <circle cx="32" cy="32" r="25" fill="url(#g)" class="core"/>
  <circle cx="32" cy="32" r="25" fill="url(#h)"/>
  <g class="ring" opacity="0.7">
    <circle cx="32" cy="32" r="29" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="6 8"/>
  </g>
  <text x="32" y="37" text-anchor="middle" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" fill="#ecfeff" letter-spacing="0.8">K8</text>
</svg>
